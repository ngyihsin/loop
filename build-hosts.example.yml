# Copy to build-hosts.yml (git-ignored). Build servers the agents may use.
build_hosts:
  - id: linux-build-01
    os: linux
    arch: x64
    transport: local          # the agent runs here; or ssh with host: user@name
    targets: [linux-x64, linux-arm64, hexagon]
    tree: "~/loop-work/slots/slot-1"
    toolchains:
      linux-arm64: "<CMake toolchain file or compiler prefix, e.g. aarch64-linux-gnu->"
      hexagon: "<Hexagon SDK root>"
  - id: win-build-01
    os: windows
    arch: x64
    transport: ssh
    host: "user@win-build-01"  # key-based auth; OpenSSH + PowerShell
    targets: [windows-x64, windows-arm64]
    tree: "D:/loop-work/tree"
    toolchains:
      windows-arm64: "<path to vcvarsall.bat> x64_arm64"

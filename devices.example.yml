# Copy to devices.yml (git-ignored). One entry per test device the device skill may use.
devices:
  - id: android-sm8750-a
    os: android
    transport: adb
    serial: "XXXXXXXX"
    soc: SM8750
    hexagon_arch: v79
    build: "<build fingerprint or meta build id>"
    scratch: /data/local/tmp/loop
  - id: wos-x-elite-01
    os: windows               # Windows on Snapdragon (arm64), OpenSSH server enabled
    transport: ssh
    host: "user@10.0.0.20"    # key-based auth; no passwords in this file
    soc: "<Snapdragon X model>"
    hexagon_arch: "<arch>"
    build: "<Windows build / NPU driver version>"
    scratch: "C:/loop"

# loop orchestrator config draft (Phase 0 manual mode only needs environment variables).
# Copy to loop.yml (git-ignored).

jira:
  url: "https://jira.company.example"     # company-hosted = Data Center; *.atlassian.net = Cloud
  auth: env:JIRA_TOKEN                     # PAT (Bearer); set env:JIRA_USER for Basic auth
  language: en                             # all Jira text in English
  base_jql: >-                             # shared scope for every route; never touch other people's tickets
    project = NPU AND assignee = currentUser() AND statusCategory != Done
  labels:                                  # agent state lives in labels; no Jira workflow change needed
    analyze: "agent:analyze"
    needs_info: "agent:needs-info"
    fix_ready: "agent:fix-ready"
    ready: "agent:ready"
    spec: "agent:spec"
    model: "agent:model"
    in_review: "agent:in-review"
    blocked: "agent:blocked"
    running: "agent:running"

manifest:
  url: "ssh://gerrit.company.example/<manifest>"
  branch: "<branch>"
  owned_projects:                          # the only gits agents may write (= LOOP_OWNED)
    - path: "<path/to/git-1>"              # build / test gates live in knowledge repos/<git>/overview.md
    - path: "<path/to/git-2>"

workspace:
  root: "~/loop-work"
  slots: 1                                 # full synced trees = writable parallelism
  branch_prefix: "loop/"

gerrit:
  url: "https://gerrit.company.example"
  auth: env:GERRIT_HTTP_PASSWORD
  upload_flags: ["--cbr", "--wip"]         # WIP first; the engineer marks it ready
  topic_from: jira_key
  never: ["+2", "submit", "abandon"]       # hard-coded

jenkins:
  url: "https://jenkins.company.example"
  auth: env:JENKINS_TOKEN                  # read console logs for Verified -1

knowledge:
  repo: "~/npu-knowledge"                  # internal git (LOOP_KNOWLEDGE)
  mcp: ["codeatlas"]                       # search_semantic, find_symbol, get_callees, get_call_chain,
                                           # get_references, get_source, find_knowledge, find_case, find_doc
  shared_folders: ["/mnt/share/npu"]       # read-only

devices: "devices.yml"                     # Android (adb) and Windows on Snapdragon (ssh)

runner:
  default: claude                          # claude | codex
  claude: "claude -p"
  codex: "codex exec"

agents:
  triage:        { timeout_min: 10, writes_code: false }
  bug-analyze:   { timeout_min: 60, writes_code: false, needs_device: optional }
  model-enable:  { timeout_min: 120, writes_code: false, needs_device: true }
  feature-spec:  { interactive: true }
  repo-onboard:  { interactive: true }
  implement:     { timeout_min: 120, writes_code: true, max_validate_attempts: 3 }
  fixer:         { timeout_min: 45, writes_code: true, max_attempts: 3 }
  review-prep:   { timeout_min: 20, writes_code: false }
  report:        { interactive: true }
  reflect:       { timeout_min: 15, writes_code: false }

autonomy:                                  # opened step by step; all false = Phase 0 manual mode
  auto_triage: false
  auto_analyze: false
  auto_implement_after_analysis: false
  auto_fix_ci: false
  auto_respond_review: false
